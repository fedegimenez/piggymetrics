security:
  oauth2:
    client:
      clientId: account-service
      clientSecret: ${ACCOUNT_SERVICE_PASSWORD}
      accessTokenUri: http://auth-service:5000/uaa/oauth/token
      grant-type: client_credentials
      scope: server

spring:
  # spring-cloud-security (legacy OAuth2) and spring-cloud-commons both define
  # accessTokenContextRelay under Spring Cloud 2021.x
  autoconfigure:
    exclude: org.springframework.cloud.security.oauth2.client.ResourceServerTokenRelayAutoConfiguration
  data:
    mongodb:
      host: account-mongodb
      username: user
      password: ${MONGODB_PASSWORD}
      database: piggymetrics
      port: 27017

server:
  servlet:
    context-path: /accounts
  port: 6000

feign:
  hystrix:
    enabled: true
