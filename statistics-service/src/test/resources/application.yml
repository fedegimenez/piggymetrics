hystrix:
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 20000

spring:
  # spring-cloud-security (legacy OAuth2) and spring-cloud-commons both define
  # accessTokenContextRelay under Spring Cloud 2021.x
  autoconfigure:
    exclude: org.springframework.cloud.security.oauth2.client.ResourceServerTokenRelayAutoConfiguration
  data:
    mongodb:
      database: piggymetrics

rates:
  url: https://api.exchangeratesapi.io

de:
  flapdoodle:
    mongodb:
      embedded:
        version: 6.0.12
